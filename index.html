<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="inp">
            <input type="text" placeholder="Enter city name here!">
            <button>Generate</button>
        </div>
        <div class="weather-card">
            <div class="left">
                <img src="img.jpeg">
                <h1>13°C</h1>
                <p>Thunderstorm with heavy rain</p>
            </div>
            <div class="right">
                <div>📍 City, State, Country</div>
                <div>🌡️ Temperature: 13°C</div>
                <div>🤗 Feels Like: 35.9°C</div>
                <div>💧 Humidity: 95%</div>
                <div>💨 Wind: 35.2 km/h</div>
                <div>🕒 2026-06-08 02:59</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
